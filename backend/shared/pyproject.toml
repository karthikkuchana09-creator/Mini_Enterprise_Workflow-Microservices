[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecwf-shared"
version = "1.0.0"
description = "ECWF shared contracts and constants for the modular service architecture"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "email-validator>=2.2.0",
]

[tool.setuptools.packages.find]
include = ["shared*"]